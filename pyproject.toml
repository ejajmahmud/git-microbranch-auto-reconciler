[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-microbranch-auto-reconciler"
version = "0.1.0"
description = "Automates isolated micro-branch checkouts, rebase synchronization, and conflict-free fast-forward merges for parallel agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
git-microbranch-auto-reconciler = "git_microbranch_auto_reconciler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["git_microbranch_auto_reconciler*"]
